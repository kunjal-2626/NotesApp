{% extends 'base.html' %}
{% block title %}{{ note.title }} - Notes App{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-10 col-lg-8">
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-4 p-md-5">
                <div class="d-flex justify-content-between align-items-start mb-3">
                    <h2 class="fw-bold text-primary mb-0">{{ note.title }}</h2>
                    <a href="{{ url_for('view_all') }}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i> Dashboard
                    </a>
                </div>
                <p class="text-muted border-bottom pb-3">
                    <i class="bi bi-clock me-1"></i> Created on {{ note.created_at.strftime('%B %d, %Y at %I:%M %p') if note.created_at else '' }}
                </p>
                
                <div class="my-4 text-dark fs-5" style="white-space: pre-wrap;">{{ note.content }}</div>
                
                <div class="d-flex gap-2 pt-3 border-top">
                    <a href="{{ url_for('update_note', note_id=note.id) }}" class="btn btn-warning px-4 fw-bold">
                        <i class="bi bi-pencil me-1"></i> Edit Note
                    </a>
                    <form action="{{ url_for('delete_note', note_id=note.id) }}" method="POST" onsubmit="return confirm('Are you sure you want to delete this note?');">
                        <button type="submit" class="btn btn-danger px-4 fw-bold">
                            <i class="bi bi-trash me-1"></i> Delete Note
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
