{% extends 'base.html' %}
{% block title %}Reset Password - NotesApp{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5">
        <div class="card card-pink border-0 p-3 p-sm-4">
            <div class="card-body">
                
                <!-- Icon & Title -->
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" 
                         style="width: 60px; height: 60px; background-color: var(--pink-light-bg); color: var(--pink-accent);">
                        <i class="bi bi-shield-lock-fill fs-2"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Set New Password</h3>
                    <p class="text-muted small mb-0">Enter your new password below</p>
                </div>

                <!-- Reset Password Form -->
                <form action="{{ url_for('reset_password_token', token=token) }}" method="POST" id="resetForm">
                    
                    <!-- New Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label small fw-bold text-secondary">NEW PASSWORD</label>
                        <div class="input-group">
                            <span class="input-group-text input-group-text-pink">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" class="form-control form-control-pink" id="password" name="password" placeholder="Enter new password" minlength="6" required autofocus>
                        </div>
                    </div>

                    <!-- Confirm New Password -->
                    <div class="mb-4">
                        <label for="confirm_password" class="form-label small fw-bold text-secondary">CONFIRM NEW PASSWORD</label>
                        <div class="input-group">
                            <span class="input-group-text input-group-text-pink">
                                <i class="bi bi-shield-check"></i>
                            </span>
                            <input type="password" class="form-control form-control-pink" id="confirm_password" name="confirm_password" placeholder="Repeat new password" required>
                        </div>
                        <div id="passwordError" class="text-danger small mt-1 d-none">
                            Passwords do not match.
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-pink-primary w-100 py-2 d-flex align-items-center justify-content-center gap-2">
                        <span>Update Password</span>
                        <i class="bi bi-arrow-right-short fs-5"></i>
                    </button>
                </form>

            </div>
        </div>
    </div>
</div>

<!-- Password Match Client-Side Validation -->
<script>
document.getElementById('resetForm').addEventListener('submit', function(e) {
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    const errorDiv = document.getElementById('passwordError');

    if (password !== confirmPassword) {
        e.preventDefault();
        errorDiv.classList.remove('d-none');
    } else {
        errorDiv.classList.add('d-none');
    }
});
</script>
{% endblock %}
