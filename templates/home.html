{% extends 'base.html' %}
{% block title %}Login - NotesApp{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5">
        <div class="card card-pink border-0">
            <div class="card-body p-4 p-md-5">
                
                <!-- Card Header -->
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" 
                         style="width: 52px; height: 52px; background-color: var(--pink-light-bg); color: var(--pink-accent);">
                        <i class="bi bi-person-heart fs-3"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Welcome Back</h3>
                    <p class="text-muted small">Please sign in to access your notes</p>
                </div>

                <form action="{{ url_for('login') }}" method="POST">
                    
                    <!-- Username or Email -->
                    <div class="mb-3">
                        <label class="form-label fw-medium text-secondary small">USERNAME</label>
                        <div class="input-group">
                            <span class="input-group-text input-group-text-pink">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input type="text" name="username" class="form-control form-control-pink" placeholder="Enter username" required autofocus>
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="mb-2">
                        <label class="form-label fw-medium text-secondary small">PASSWORD</label>
                        <div class="input-group">
                            <span class="input-group-text input-group-text-pink">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" name="password" class="form-control form-control-pink" placeholder="Enter password" required>
                        </div>
                    </div>

                    <!-- Forgot Password Link Aligned Left -->
                    <div class="text-start mb-3">
                        <a href="{{ url_for('forgot_password') }}" class="small fw-semibold text-decoration-none" style="color: var(--pink-accent);">
                            Forgot password?
                        </a>
                    </div>

                    <!-- Remember Me Option -->
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" name="remember" id="rememberMe">
                        <label class="form-check-label small text-muted" for="rememberMe">
                            Remember me on this device
                        </label>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="btn btn-pink-primary w-100 py-2.5 d-flex align-items-center justify-content-center gap-2 mb-3">
                        <span class="fw-semibold">Sign In</span>
                        <i class="bi bi-box-arrow-in-right"></i>
                    </button>

                    <!-- Register / Sign Up Link -->
                    <div class="text-center pt-2 border-top mt-4">
                        <p class="text-muted small mb-0 pt-2">
                            Don't have an account yet? 
                            <a href="{{ url_for('register') }}" class="fw-bold text-decoration-none" style="color: var(--pink-accent);">
                                Create an account
                            </a>
                        </p>
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
