{% extends 'base.html' %}
{% block title %}Add Note - Notes App{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-10 col-lg-8">
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-4 p-md-5">
                <h3 class="fw-bold text-primary mb-4">Create New Note</h3>
                <form action="{{ url_for('add_note') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Note Title</label>
                        <input type="text" name="title" class="form-control form-control-lg" placeholder="Enter note title" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Note Content</label>
                        <textarea name="content" class="form-control" rows="8" placeholder="Write your note content here..." required></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary btn-lg px-4 fw-bold">Save Note</button>
                        <a href="{{ url_for('view_all') }}" class="btn btn-outline-secondary btn-lg px-4">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
