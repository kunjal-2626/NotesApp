{% extends 'base.html' %}
{% block title %}Reset Password - NotesApp{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5">
        <div class="card card-pink border-0">
            <div class="card-body p-4 p-md-5">
                
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" 
                         style="width: 50px; height: 50px; background-color: var(--pink-light-bg); color: var(--pink-accent);">
                        <i class="bi bi-key-fill fs-4"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Forgot Password?</h3>
                    <p class="text-muted small">Enter your email address to receive a password reset link.</p>
                </div>

                <form action="{{ url_for('forgot_password') }}" method="POST">
                    
                    <div class="mb-4">
                        <label class="form-label fw-medium text-secondary small">EMAIL ADDRESS</label>
                        <div class="input-group">
                            <span class="input-group-text input-group-text-pink">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input type="email" name="email" class="form-control form-control-pink" placeholder="name@example.com" required autofocus>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-pink-primary w-100 py-2.5 d-flex align-items-center justify-content-center gap-2 mb-3">
                        <span class="fw-semibold">Send Reset Link</span>
                        <i class="bi bi-arrow-right"></i>
                    </button>

                    <div class="text-center pt-2">
                        <a href="{{ url_for('login') }}" class="small fw-semibold text-decoration-none text-muted">
                            <i class="bi bi-arrow-left me-1"></i> Back to Login
                        </a>
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
